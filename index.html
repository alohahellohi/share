<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的影片分享</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#202631;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}header{padding:32px max(20px,calc((100vw - 1100px)/2));background:#fff;border-bottom:1px solid #e7e9ee}h1{margin:0;font-size:clamp(25px,4vw,36px)}header p{color:#647084;margin:8px 0 0}main{max-width:1140px;margin:auto;padding:12px 20px 60px}section{margin-top:34px}h2{font-size:23px;margin:0 0 14px}.scroller{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 2px 18px;scrollbar-color:#adb6c5 transparent}.video-card{flex:0 0 clamp(260px,72vw,360px);scroll-snap-align:start;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #17213b12}.video-frame{aspect-ratio:4/5;background:#15191f;display:flex;align-items:center;justify-content:center}.video-frame video{width:100%;height:100%;display:block;object-fit:contain}.desc{padding:14px 16px;line-height:1.6;min-height:66px}.hint{font-size:13px;color:#657186;margin:0 0 12px}@media(min-width:800px){.video-card{flex-basis:340px}}
</style>
</head>
<body>
<header><h1>我的影片分享</h1><p>依主題整理影片，向左右滑動即可瀏覽更多內容。</p></header>
<main id="gallery"></main>
<script>
// 修改這裡即可新增主題、影片與說明。影片路徑相對於 index.html，例如 videos/video1.mp4。
const topics = [
 {title:'標題1',videos:[
  {url:'videos/video1.mp4',description:'影片一：這裡填入簡短介紹。'},
  {url:'videos/video2.mp4',description:'影片二：這裡填入簡短介紹。'},
  {url:'videos/video3.mp4',description:'影片三：向右滑動可看更多。'}
 ]},
 {title:'標題2',videos:[
  {url:'videos/video4.mp4',description:'另一個主題的第一部影片。'},
  {url:'videos/video5.mp4',description:'另一個主題的第二部影片。'}
 ]}
];
const gallery=document.getElementById('gallery');
for(const topic of topics){const section=document.createElement('section');const title=document.createElement('h2');title.textContent=topic.title;section.append(title);const hint=document.createElement('p');hint.className='hint';hint.textContent='← 左右滑動，查看更多影片 →';section.append(hint);const scroller=document.createElement('div');scroller.className='scroller';for(const item of topic.videos){const card=document.createElement('article');card.className='video-card';const frame=document.createElement('div');frame.className='video-frame';if(/\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(item.url)){const video=document.createElement('video');video.src=item.url;video.controls=true;video.preload='metadata';video.playsInline=true;video.setAttribute('aria-label',item.description||'影片');frame.append(video)}else{const note=document.createElement('p');note.textContent='請確認影片路徑與格式（MP4、WebM、Ogg）';note.style='color:white;padding:20px';frame.append(note)}const desc=document.createElement('div');desc.className='desc';desc.textContent=item.description||'';card.append(frame,desc);scroller.append(card)}section.append(scroller);gallery.append(section)}
</script>
</body></html>
